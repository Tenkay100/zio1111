<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | IDB Global Federal Credit Union</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>

<body class="flex-center" style="min-height: 100vh; background: var(--bg-800); padding: 24px 0;">

  <div class="container flex-center w-full">
    <div class="card card-glass animate-scale-in" style="width: 100%; max-width: 440px; padding: 40px;">

      <div class="text-center mb-32">
        <div class="flex-center mb-16">
          <div class="brand-logo"
            style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
            <i class="ph-fill ph-lock-key-open" style="font-size: 1.8rem; color: #fff;"></i>
          </div>
        </div>
        <h2>Reset Password</h2>
        <p class="mt-8 text-sm text-muted">Enter your registered email and choose a new password.</p>
      </div>

      <form id="reset-form" class="form-group gap-16" autocomplete="off">
        <div id="reset-alert" class="alert hidden"></div>

        <div class="form-group">
          <label class="form-label">Registered Email</label>
          <div class="input-group">
            <i class="ph-bold ph-envelope-simple input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-group">
            <i class="ph-bold ph-lock-key input-icon"></i>
            <input type="password" id="new-password" class="form-input" placeholder="Minimum 8 characters" required minlength="8">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div class="input-group">
            <i class="ph-bold ph-check-circle input-icon"></i>
            <input type="password" id="confirm-password" class="form-input" placeholder="Repeat your new password" required minlength="8">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary w-full mt-8" style="padding: 14px;">
          <span>Update Password</span>
          <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>

      <div class="text-center mt-24 text-sm text-muted">
        Remembered your password? <a href="login.html" class="font-bold">Back to Sign In</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { dbSelect, dbUpdate } from './assets/js/firebase.js';

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('reset-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const newPwd = document.getElementById('new-password').value;
      const confPwd = document.getElementById('confirm-password').value;

      if (newPwd !== confPwd) {
        alertBox.className = 'alert alert-danger animate-fade-in';
        alertBox.innerHTML = '<i class="ph-bold ph-warning-circle"></i> Passwords do not match.';
        alertBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="ph-bold ph-spinner spinner"></i> Updating...';
      alertBox.classList.add('hidden');

      const { data: users } = await dbSelect('users', { eq: { email } });
      if (!users || users.length === 0) {
        alertBox.className = 'alert alert-danger animate-fade-in';
        alertBox.innerHTML = '<i class="ph-bold ph-warning-circle"></i> No account registered with that email address.';
        alertBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Update Password</span><i class="ph-bold ph-arrow-right"></i>';
        return;
      }

      localStorage.setItem('aff_mock_pwd_' + email, JSON.stringify(newPwd));
      localStorage.setItem('mock_pwd_' + email, newPwd);

      alertBox.className = 'alert alert-success animate-fade-in';
      alertBox.innerHTML = '<i class="ph-bold ph-check-circle"></i> Password reset successfully! Redirecting to sign in...';
      alertBox.classList.remove('hidden');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });
  </script>
</body>

</html>
